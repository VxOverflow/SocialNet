<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amis — SocialNet ESGIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
<div id="navbar-mount"></div>

<div class="layout layout-2col">
  <aside class="sidebar-left">
    <div class="card profile-mini">
      <img class="avatar" id="mini-photo" src="" alt="">
      <b id="mini-name"></b>
      <span>ESGIS Cotonou</span>
    </div>
    <div class="card shortcut-list">
      <a href="profil.html"><span class="ic"></span>Mon profil</a>
      <a href="accueil.html"><span class="ic"></span>Fil d'actualité</a>
      <a href="chat.html"><span class="ic"></span>Messages</a>
      <a href="parametres.html"><span class="ic"></span>Paramètres</a>
    </div>
  </aside>

  <main>
    <div class="card" style="padding:16px;margin-bottom:14px;">
      <p class="section-title">Demandes d'amis reçues</p>
      <div id="friend-requests"></div>
    </div>

    <div class="card" style="padding:16px;margin-bottom:14px;">
      <p class="section-title">Mes amis</p>
      <div id="friends-list"></div>
    </div>

    <div class="card" style="padding:16px;">
      <p class="section-title">Rechercher des étudiants</p>
      <div class="composer-extra" style="margin-bottom:14px;">
        <input type="text" id="friend-search-input" placeholder="Nom, prénom ou email..." style="flex:1;border:1px solid var(--border);border-radius:999px;padding:9px 16px;font-size:13px;">
        <button class="mini-btn add" id="btn-search">Rechercher</button>
      </div>
      <div id="search-results"></div>
    </div>
  </main>
</div>

<script src="../../assets/js/common.js"></script>
<script src="../../assets/js/friends.js"></script>
<script>
  const currentUser = requireAuth();
  if (currentUser) {
    mountNavbar('amis');
    const photo = currentUser.photo ? '../../' + currentUser.photo : 'https://api.dicebear.com/9.x/avataaars/svg?seed=' + encodeURIComponent(currentUser.prenom);
    document.getElementById('mini-photo').src = photo;
    document.getElementById('mini-name').textContent = currentUser.prenom + ' ' + currentUser.nom;
  }
</script>
</body>
</html>
